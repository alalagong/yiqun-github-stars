name: 发布 GitHub Pages

on:
  push:
    paths:
      - "index.html"
      - "demo/**"
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

